name: Build test and publish
on:
  push:
    branches: [dev-main, main]
  pull_request:
    branches: [dev-main, main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Labaik.sln
      - run: dotnet build Labaik.sln --no-restore --configuration Release
      # Docker is required here; there is no optional skip for the database integration test.
      - run: dotnet test Labaik.sln --no-build --configuration Release --logger "trx;LogFilePrefix=tests" --results-directory artifacts/tests
      - name: Check local push receiver safety
        run: python3 -m unittest discover -s scripts/tests -p test_push_demo.py -v
      - name: Scan all direct and transitive packages
        run: |
          mkdir -p artifacts
          dotnet list Labaik.sln package --vulnerable --include-transitive --format json > artifacts/vulnerabilities.json
          python3 scripts/check-vulnerabilities.py artifacts/vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: artifacts/

  images:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_root: ${{ steps.names.outputs.root }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry path
        id: names
        shell: bash
        run: echo "root=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Labaik.Api/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.root }}/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Labaik.FakeGateway/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.root }}/fake-gateway:${{ github.sha }}

  staging:
    needs: images
    if: github.ref == 'refs/heads/dev-main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_root: ${{ needs.images.outputs.image_root }}
      revision: ${{ github.sha }}
    secrets: inherit

  production:
    needs: images
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_root: ${{ needs.images.outputs.image_root }}
      revision: ${{ github.sha }}
    secrets: inherit
